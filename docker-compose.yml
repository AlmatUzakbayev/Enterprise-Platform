version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise_backend
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./backend/uploads:/app/uploads
      - model_cache:/root/.cache/huggingface   # named volume; change to ./model_cache:... if you want host files
    ports:
      - "8080:8080"
    depends_on:
      - qdrant
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport sys,urllib.request as u\ntry:\n    u.urlopen('http://localhost:8080/health', timeout=5)\nexcept Exception as e:\n    sys.exit(1)\nsys.exit(0)\nPY"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    command: ["./qdrant", "--memory-lock"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport sys, urllib.request as u\ntry:\n    u.urlopen('http://localhost:6333/collections', timeout=5)\nexcept Exception:\n    sys.exit(1)\nsys.exit(0)\nPY"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  qdrant_storage:
  model_cache:
